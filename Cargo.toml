[package]
name = "accounting"
version = "0.1.0"
edition = "2021"
description = "Aylık gelir/gider takibi (Qt 6 + Kirigami, Breeze)"
license = "GPL-3.0"
homepage = "https://github.com/krhkayra/kmuhasebe"
repository = "https://github.com/krhkayra/kmuhasebe"
authors = [
	"Kayra <https://github.com/krhkayra>"
]


# Bağımlılıklar bilinçli olarak minimumda tutuldu:
#  - cxx / cxx-qt / cxx-qt-lib : Rust <-> Qt köprüsü (zorunlu)
#  - serde / serde_json        : veri dosyası ve QML'e JSON aktarımı
[dependencies]
cxx = "1"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_gui", "qt_qml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.7"
